<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link 
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" 
      rel="stylesheet" 
      integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" 
      crossorigin="anonymous"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link
      id="dark-theme-style"
      rel="stylesheet"
      href="https://bootswatch.com/4/minty/bootstrap.min.css"
    />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <title>Receipe App</title>
</head> 

<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <a class="navbar-brand" href="#">SRB</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
  
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item active">
          <a class="nav-link" href="#">Home <span class="sr-only">(current)</span></a>
        </li>
      </ul>
      <form class="form-inline my-2 my-lg-0">
        <input class="form-control mr-sm-2" type="search" name = "search" aria-label="Search">
        <button class="btn btn-outline-success my-2 my-sm-0" type="submit">Search</button>
      </form>
    </div>
  </nav>
    <h1 class="text-center">Receipe App</h1>
     <div class="row m-1">
        <!-- Column Number -->
        <div class="container mt-4 col-md-6 col-xs-12">
            <form class="boder rounded p-4" id="book-form" method="post" enctype="multipart/form-data">
              {% csrf_token %}
                  <!-- name -->
                <div class="form-outline mb-4">
                    <label for="title">Receipe Name</label>
                    <input 
                      type="text"
                      class="form-control" 
                      id="title"  
                      placeholder="Add Book"
                      name = "rname"
                      required
                    />
                </div>

                  <!-- Description -->
                  <div class="form-outline mb-3">
                    <label for="rdesc">Receipe Description</label>
                    <textarea 
                      name="rdesc" 
                      id="rdesc" 
                      class="form-control"
                      required
                      ></textarea>

                </div>


                  <!--Image-->
                <div>
                  <div class="mb-4 d-flex ">
                      <img id="selectedImage" src="https://mdbootstrap.com/img/Photos/Others/placeholder.jpg"
                      alt="example placeholder" style="width: 100px;" />
                      <label class="form-label text-white m-1 btn btn-primary" for="customFile1">Choose file</label>
                    <input 
                      type="file" 
                      class="form-control d-none" 
                      id="customFile1" 
                      onchange="displaySelectedImage(event, 'selectedImage')"
                      name="rimg" 
                      />
                  </div><br>
              </div>
                  

                <!-- Button -->
                <button type="submit" class="btn btn-primary col-12">Add Receipe</button>
            </form>
        </div>


  

        <!-- Column Number 2 -->
        <div class="container mt-4 col-md-6 col-xs-12">
            <table class="table table-striped" id="book-list">
              <thead>
                  <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Image</th>
                    <th>Action</th>
                  </tr>  
              </thead>
              <tbody>
              {% for receipe in receipes %} 
              <tr>
                <td>{{forloop.counter}}</td>
                <td>{{receipe.recipe_name}}</td>
                <td>{{receipe.recipe_desc}}</td>
                <td>
                  <img src="/media/{{receipe.recipe_image}}" style="height: 100px; width: 100px" ></td>
                <td><a href="/delR/{{receipe.id}}/" class="btn btn-danger">Delete</a><a href="/updateR/{{receipe.id}}" class="btn btn-info">Update</a></td>
              </tr> 
              {% endfor%}
            </tbody>
            </table>
        </div> 
        
    </div>
    <footer class="bg-black text-white py-3">
        <div class="container text-center">
          <div class="social-links mb-2">
            <a href="https://www.linkedin.com/in/shrirambansal/" target="_blank" rel="noopener noreferrer" class="text-white me-3">
              LinkedIn
            </a>
            <a href="https://github.com/shrirambansal" target="_blank" rel="noopener noreferrer" class="text-white">
              GitHub
            </a>
          </div>
          <p class="mb-0">© 2025 Shriram Bansal. All Rights Reserved.</p>
        </div>
      </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    
    <script>
      function displaySelectedImage(event, elementId) {
        const selectedImage = document.getElementById(elementId);
        const fileInput = event.target;
    
        if (fileInput.files && fileInput.files[0]) {
            const reader = new FileReader();
    
            reader.onload = function(e) {
                selectedImage.src = e.target.result;
            };
    
            reader.readAsDataURL(fileInput.files[0]);
        }
    }

   
    </script>
  </body>
</html>
